name: IssueOps Backend

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issueops-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  issueops:
    if: |
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'issueops-trigger')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'issueops-trigger')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Acknowledge issue
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Workflow run started: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Parse issue body
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, sys, yaml

          body = os.environ.get("ISSUE_BODY", "") or ""
          m = re.search(r"```ya?ml\s*(.*?)```", body, re.DOTALL)
          payload = {}
          if m:
              try:
                  payload = yaml.safe_load(m.group(1)) or {}
              except Exception as e:
                  print(f"yaml-error={e}", file=sys.stderr)

          filename = (payload.get("filename") or "issueops-output.txt").strip()
          content = payload.get("content") or "Generated by IssueOps workflow.\n"

          # Restrict to safe path: no leading slash, no traversal.
          if filename.startswith("/") or ".." in filename.split("/"):
              filename = "issueops-output.txt"

          # Write outputs (use heredoc for multiline content).
          print(f"filename={filename}")
          print("content<<__EOF__")
          print(content, end="" if content.endswith("\n") else "\n")
          print("__EOF__")
          PY

      - name: Create branch, file, and commit
        id: commit
        shell: bash
        env:
          FILENAME: ${{ steps.parse.outputs.filename }}
          FILECONTENT: ${{ steps.parse.outputs.content }}
        run: |
          set -euo pipefail
          BRANCH="issueops/${ISSUE_NUMBER}-$(date +%s)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          mkdir -p "$(dirname "$FILENAME")"
          printf '%s' "$FILECONTENT" > "$FILENAME"

          git add -- "$FILENAME"
          git commit -m "IssueOps: add $FILENAME (refs #${ISSUE_NUMBER})"
          git push -u origin "$BRANCH"

      - name: Open pull request
        id: pr
        shell: bash
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          FILENAME: ${{ steps.parse.outputs.filename }}
        run: |
          set -euo pipefail
          PR_URL=$(gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "IssueOps: add $FILENAME (#${ISSUE_NUMBER})" \
            --body "Automated PR for issue #${ISSUE_NUMBER}.

          Adds \`$FILENAME\`.

          Closes #${ISSUE_NUMBER}.")
          PR_NUMBER=$(echo "$PR_URL" | awk -F/ '{print $NF}')
          echo "url=$PR_URL"      >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Comment PR link on issue (parseable marker)
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "<!-- issueops-pr -->
          Pull request opened: #${PR_NUMBER} — ${PR_URL}"

      - name: Report failure on issue
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "IssueOps workflow failed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
